name: CI

on:
  push:
    branches:
      - main
      - feat/**
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate config
        run: node ./src/cli.js validate-config

      - name: Run tests
        run: npm test

      - name: Smoke analyze fixture
        run: node ./src/cli.js analyze ./test/fixtures/sample-app --output ai-output
